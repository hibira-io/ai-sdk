name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Package contents
        run: npm pack --dry-run

  # Older AI SDK majors (ai 5 and 6 still run on Node 20).
  ai:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ai: ["5", "6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm install --no-save ai@${{ matrix.ai }}
      - run: npm test
